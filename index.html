<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jbox, a MortimerSoftware app for iOS and Android, is coming soon.">
    <title>MortimerSoftware | Jbox Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/jbox-app-icon-framed.png">
    <link rel="apple-touch-icon" href="assets/jbox-app-icon-framed.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body id="top">
    <header class="site-header">
        <a class="brand" href="/" aria-label="MortimerSoftware home">
            <span class="brand-mark">
                <img src="assets/jbox-app-icon-framed.png" alt="">
            </span>
            <span>MortimerSoftware</span>
        </a>
        <nav class="site-nav" aria-label="Primary navigation">
            <a href="#top" data-section="jbox" aria-current="page">Jbox</a>
            <a href="#links" data-section="jameson">Jameson</a>
        </nav>
    </header>

    <main>
        <section class="hero" id="jbox" aria-labelledby="hero-title">
            <div class="hero-copy">
                <h1 id="hero-title">Jbox</h1>
                <p class="hero-text">All your games, in one place.</p>

                <div class="store-badges" aria-label="Store availability">
                    <a class="store-badge is-disabled" href="#" aria-disabled="true" onclick="return false;">
                        <i class="fab fa-apple" aria-hidden="true"></i>
                        <span>
                            <small>Coming soon on the</small>
                            App Store
                        </span>
                    </a>
                    <a class="store-badge is-disabled" href="#" aria-disabled="true" onclick="return false;">
                        <i class="fab fa-google-play" aria-hidden="true"></i>
                        <span>
                            <small>Coming soon on</small>
                            Google Play
                        </span>
                    </a>
                </div>
            </div>

            <div class="app-preview" aria-label="Jbox app preview">
                <div class="phone phone-back">
                    <div class="phone-screen alt-screen">
                        <div class="mini-status"></div>
                        <div class="stacked-bars">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <div class="preview-grid">
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>
                <div class="phone phone-front">
                    <div class="phone-speaker"></div>
                    <div class="phone-screen">
                        <img class="app-icon" src="assets/jbox-app-icon-framed.png" alt="Jbox app icon">
                        <p>Jbox</p>
                        <div class="launch-card">
                            <span>Mobile launch</span>
                            <strong>Soon</strong>
                        </div>
                        <div class="signal-row">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="availability" aria-label="Launch status">
            <div>
                <span class="status-dot"></span>
                App Store and Play Store listings are coming soon.
            </div>
        </section>

        <section class="links-section" id="links" aria-labelledby="links-title">
            <div>
                <h2 id="links-title">Links</h2>
            </div>
            <div class="link-grid">
                <a class="link-card" href="https://www.linkedin.com/in/jamesonmortimer" target="_blank" rel="noopener">
                    <i class="fab fa-linkedin" aria-hidden="true"></i>
                    <span>
                        <strong>LinkedIn</strong>
                    </span>
                </a>
                <a class="link-card" href="https://github.com/jamesonmortimer" target="_blank" rel="noopener">
                    <i class="fab fa-github" aria-hidden="true"></i>
                    <span>
                        <strong>GitHub</strong>
                    </span>
                </a>
                <a class="link-card" href="https://drive.google.com/file/d/1Z-QeDpl1MjYLEJN9vUjjjN3EfxyTBK4f/view?usp=sharing" target="_blank" rel="noopener">
                    <i class="fas fa-file-alt" aria-hidden="true"></i>
                    <span>
                        <strong>Resume</strong>
                    </span>
                </a>
            </div>
        </section>
    </main>

    <footer>
        <p>
            &copy; 2026 MortimerSoftware
            &middot;
            <a href="/jbox/privacy/">Jbox Privacy Policy</a>
        </p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
